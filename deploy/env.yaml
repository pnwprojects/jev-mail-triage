# Runtime config for the Cloud Run function. Edit, then re-run deploy/deploy.sh.
# Once rules are seeded (scripts/seed_rules.py), the policy keys below (categories,
# thresholds, archive/protected lists, JEV_MODEL, LEARN_JUNK_SENDERS) come from the
# rules console instead and are ignored here. DRY_RUN: "true" still pauses everything.
GOOGLE_CLOUD_PROJECT: "your-project-id"  # the GCP project everything is deployed to
GMAIL_USER: "you@your-domain.example"  # rejects notifications for any other mailbox; confirm the address
JEV_PROVIDER: "typesafe"            # TypeSafe direct (https://api.typesafe.ai)
JEV_MODEL: "jev-latest"             # or pin a release, e.g. "jev-1.13.0", so behaviour doesn't shift under you
CONFIDENCE_THRESHOLD: "0.7"         # below this, mail gets AI/Review instead (unless archived or spammed)
# Categories that leave the Inbox (comma-separated). Everything else is labelled and stays.
ARCHIVE_CATEGORIES: "Political funding requests,Political action requests"
ARCHIVE_THRESHOLD: "0.9"            # combined probability of the archive categories needed to archive
SPAM_THRESHOLD: "0.95"              # probability of Junk needed to move mail to Spam
LEARN_JUNK_SENDERS: "true"          # move mail to Spam when its sender already has mail in Spam
# Archive/Spam never happen for these domains (or subdomains); they're only labelled.
PROTECTED_DOMAINS: "irs.gov,google.com,github.com"
LABEL_PREFIX: "AI/"
BODY_CHARS: "1500"
DRY_RUN: "true"                     # logs decisions and changes nothing; set "false" to go live (README step 6)
# CATEGORIES_JSON: '{"Name": "description Jev sees", ...}'   # replaces the default category list
